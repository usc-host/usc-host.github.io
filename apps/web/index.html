<!doctype html>
<html lang="pt-BR" class="boot-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Pizzas premium, esfihas e combos da Bella Massa, em Barra Bonita. Monte sua pizza e peça ajuda ao nosso assistente." />
    <meta name="theme-color" content="#FFF9F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://instadelivery-public.nyc3.cdn.digitaloceanspaces.com" crossorigin />
    <title>Bella Massa | Pizzas e esfihas artesanais</title>
    <script>
      /* Theme before first paint: saved choice, otherwise the system preference. */
      (function () {
        var t = null;
        try { t = localStorage.getItem('bm-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var r = document.documentElement;
        r.dataset.theme = t;
        r.classList.toggle('dark', t === 'dark');
        r.style.colorScheme = t;
      })();
    </script>
    <style>
      /* Brand loader styles live here so the boot screen paints before any bundle.
         The React BrandLoader reuses these same classes for page transitions. */
      :root { --boot-bg: #fff9f0; --boot-text: #62594f; }
      :root[data-theme='dark'] { --boot-bg: #141311; --boot-text: #c2b8aa; }
      html, body { margin: 0; background: var(--boot-bg); }
      html.boot-active, html.boot-active body { overflow: hidden; }

      /* Each drop is a circle in the logo mask. The center opens first and the
         others land a moment later around it, like drops spreading. */
      @property --d1 { syntax: '<length>'; inherits: false; initial-value: 0px; }
      @property --d2 { syntax: '<length>'; inherits: false; initial-value: 0px; }
      @property --d3 { syntax: '<length>'; inherits: false; initial-value: 0px; }
      @property --d4 { syntax: '<length>'; inherits: false; initial-value: 0px; }
      @property --d5 { syntax: '<length>'; inherits: false; initial-value: 0px; }
      @property --d6 { syntax: '<length>'; inherits: false; initial-value: 0px; }
      @property --d7 { syntax: '<length>'; inherits: false; initial-value: 0px; }

      .bm-loader {
        --bm-speed: 1;
        position: fixed; inset: 0; z-index: 2000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: var(--boot-bg); color: var(--boot-text);
        font: 600 15px/1.2 'Manrope Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.02em;
        animation: bm-fade-in 160ms ease-out both;
        transition: opacity 220ms ease, visibility 0s linear 220ms;
      }
      .bm-loader.is-leaving { opacity: 0; visibility: hidden; }
      .bm-loader--brief { --bm-speed: 0.6; }
      .bm-loader--inline { position: static; background: transparent; padding: 48px 16px; animation: none; }
      .bm-loader__plate {
        position: relative;
        width: min(260px, 64vw); aspect-ratio: 355 / 214;
        filter: drop-shadow(0 14px 22px rgba(60, 30, 10, 0.18));
      }
      .bm-loader--compact .bm-loader__plate { width: 132px; }
      .bm-loader__logo {
        display: block; width: 100%; height: 100%; object-fit: contain;
        -webkit-mask-image:
          radial-gradient(circle var(--d1) at 50% 50%, #000 86%, transparent),
          radial-gradient(circle var(--d2) at 28% 38%, #000 82%, transparent),
          radial-gradient(circle var(--d3) at 73% 62%, #000 82%, transparent),
          radial-gradient(circle var(--d4) at 50% 14%, #000 82%, transparent),
          radial-gradient(circle var(--d5) at 46% 88%, #000 82%, transparent),
          radial-gradient(circle var(--d6) at 9% 56%, #000 82%, transparent),
          radial-gradient(circle var(--d7) at 92% 42%, #000 82%, transparent);
        mask-image:
          radial-gradient(circle var(--d1) at 50% 50%, #000 86%, transparent),
          radial-gradient(circle var(--d2) at 28% 38%, #000 82%, transparent),
          radial-gradient(circle var(--d3) at 73% 62%, #000 82%, transparent),
          radial-gradient(circle var(--d4) at 50% 14%, #000 82%, transparent),
          radial-gradient(circle var(--d5) at 46% 88%, #000 82%, transparent),
          radial-gradient(circle var(--d6) at 9% 56%, #000 82%, transparent),
          radial-gradient(circle var(--d7) at 92% 42%, #000 82%, transparent);
        animation:
          bm-d1 calc(var(--bm-speed) * 720ms) cubic-bezier(0.3, 1.25, 0.5, 1) calc(var(--bm-speed) * 60ms) both,
          bm-d2 calc(var(--bm-speed) * 460ms) cubic-bezier(0.34, 1.5, 0.6, 1) calc(var(--bm-speed) * 170ms) both,
          bm-d3 calc(var(--bm-speed) * 480ms) cubic-bezier(0.34, 1.5, 0.6, 1) calc(var(--bm-speed) * 230ms) both,
          bm-d4 calc(var(--bm-speed) * 420ms) cubic-bezier(0.34, 1.5, 0.6, 1) calc(var(--bm-speed) * 300ms) both,
          bm-d5 calc(var(--bm-speed) * 440ms) cubic-bezier(0.34, 1.5, 0.6, 1) calc(var(--bm-speed) * 270ms) both,
          bm-d6 calc(var(--bm-speed) * 420ms) cubic-bezier(0.34, 1.5, 0.6, 1) calc(var(--bm-speed) * 360ms) both,
          bm-d7 calc(var(--bm-speed) * 400ms) cubic-bezier(0.34, 1.5, 0.6, 1) calc(var(--bm-speed) * 390ms) both;
      }
      @keyframes bm-d1 { to { --d1: 180px; } }
      @keyframes bm-d2 { to { --d2: 70px; } }
      @keyframes bm-d3 { to { --d3: 74px; } }
      @keyframes bm-d4 { to { --d4: 54px; } }
      @keyframes bm-d5 { to { --d5: 58px; } }
      @keyframes bm-d6 { to { --d6: 48px; } }
      @keyframes bm-d7 { to { --d7: 50px; } }
      .bm-loader__wordmark {
        display: none; height: 100%; align-items: center; justify-content: center;
        font: 700 28px/1 'Montserrat Variable', system-ui, sans-serif; color: #b92c28;
      }
      .bm-loader__plate.is-fallback .bm-loader__logo { display: none; }
      .bm-loader__plate.is-fallback .bm-loader__wordmark { display: flex; }
      .bm-loader__label { display: inline-flex; font-variant-numeric: tabular-nums; }
      .bm-dots { display: inline-block; width: 1.3em; text-align: left; }
      .bm-loader__error { display: none; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 320px; padding: 0 16px; }
      .bm-loader.has-error .bm-loader__label { display: none; }
      .bm-loader.has-error .bm-loader__error { display: flex; }
      .bm-loader__error p { margin: 0; color: var(--boot-text); font-weight: 500; line-height: 1.5; }
      .bm-loader__actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .bm-loader__button {
        min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent;
        font: inherit; font-weight: 700; cursor: pointer; background: #b92c28; color: #fff;
      }
      .bm-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      @keyframes bm-fade-in { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .bm-loader { animation: bm-fade-in 120ms ease-out both; }
        .bm-loader__logo { animation: none; -webkit-mask-image: none; mask-image: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="bm-loader" role="status">
      <span class="bm-sr-only">Carregando página</span>
      <div class="bm-loader__plate" id="boot-plate">
        <img
          class="bm-loader__logo"
          src="/logo.png"
          alt=""
          width="355"
          height="214"
          fetchpriority="high"
          onerror="this.parentNode.classList.add('is-fallback')"
        />
        <span class="bm-loader__wordmark" aria-hidden="true">Bella Massa</span>
      </div>
      <span class="bm-loader__label" aria-hidden="true">Carregando<span class="bm-dots" data-dots>.</span></span>
      <div class="bm-loader__error" role="alert">
        <p>Não foi possível abrir o cardápio agora. Confira sua conexão e tente novamente.</p>
        <div class="bm-loader__actions">
          <button class="bm-loader__button" type="button" onclick="location.reload()">Tentar novamente</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      /* Boot controller: cycles the dots, waits for React to call done(),
         and turns into a recoverable error if the app never becomes ready. */
      (function () {
        var boot = document.getElementById('boot');
        var dots = boot.querySelector('[data-dots]');
        var n = 1;
        var cycle = setInterval(function () { n = n % 3 + 1; dots.textContent = '...'.slice(0, n); }, 450);
        var started = performance.now();
        var timer = setTimeout(function () { boot.classList.add('has-error'); clearInterval(cycle); }, 15000);
        window.__bellaBoot = {
          done: function () {
            clearTimeout(timer);
            /* Let the drops finish so the logo never blinks on fast connections. */
            var wait = Math.max(0, 860 - (performance.now() - started));
            setTimeout(function () {
              boot.classList.add('is-leaving');
              document.documentElement.classList.remove('boot-active');
              setTimeout(function () { clearInterval(cycle); boot.remove(); }, 260);
            }, wait);
          },
          fail: function () { clearTimeout(timer); boot.classList.add('has-error'); clearInterval(cycle); }
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
